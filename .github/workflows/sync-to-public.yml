# ============================================================
# Sync workflow — runs on the PRIVATE source repo
# (AppDataSci3-Advanced)
#
# On every push to main, mirror the commit to the public
# preview repo (Demo3AppDataSci).
#
# ONE-WAY: private -> public only.
# The public repo is a pure preview mirror — never push to it
# directly. All work happens on private, syncs here automatically.
#
# ⚠️ SECRET REQUIRED
# ---------------
# Add `SYNC_TO_PUBLIC_PAT` as a repository secret on the
# private repo (AppDataSci3-Advanced). The PAT needs
# 'Contents: write' scope on testdemoqwenai2025-creator/Demo3AppDataSci.
# We do NOT fall back to GITHUB_TOKEN — that token is scoped to
# the current repo only and CANNOT push cross-repo.
# ============================================================
name: Mirror to public preview repo

on:
  push:
    branches:
      - main
    paths-ignore:
      # Don't fire on workflow-only commits (avoids sync loops)
      - '.github/workflows/**'
      # Don't fire on pure-worklog commits — they don't affect the deployed site
      - 'worklog.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Only run on the private source repo — never on Demo3AppDataSci.
    # This prevents infinite mirror loops (the public mirror has this
    # file too, but no SYNC_TO_PUBLIC_PAT secret on the public side).
    if: |
      github.repository == 'testdemoqwenai2025-creator/AppDataSci3-Advanced'

    steps:
      - name: Sanity-check secret presence (fail fast if missing)
        env:
          GH_PAT: ${{ secrets.SYNC_TO_PUBLIC_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::SYNC_TO_PUBLIC_PAT secret is not set on ${{ github.repository }}."
            echo "::error::Add it via: Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::The PAT needs 'Contents: write' on testdemoqwenai2025-creator/Demo3AppDataSci."
            exit 1
          fi
          echo "SYNC_TO_PUBLIC_PAT is set."

      - name: Checkout source (full history for tags + force-push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push mirror to public repo (Demo3AppDataSci)
        env:
          GH_PAT: ${{ secrets.SYNC_TO_PUBLIC_PAT }}
        run: |
          git remote add public "https://x-access-token:${GH_PAT}@github.com/testdemoqwenai2025-creator/Demo3AppDataSci.git" || true

          git fetch public main

          # If public/main is already at HEAD, no-op (saves Actions minutes).
          PUBLIC_HASH=$(git rev-parse public/main)
          SOURCE_HASH=$(git rev-parse HEAD)
          if [ "$PUBLIC_HASH" = "$SOURCE_HASH" ]; then
            echo "Public main already at $SOURCE_HASH — nothing to push."
            exit 0
          fi

          # Mirror is one-way: private -> public, always overwrite main on public.
          git push --force public refs/heads/main:refs/heads/main
          git push --tags --force public || true

      - name: Verify sync landed (exit 1 on mismatch so failure() triggers)
        env:
          GH_PAT: ${{ secrets.SYNC_TO_PUBLIC_PAT }}
        run: |
          git fetch public main --force
          PUBLIC_HASH=$(git rev-parse public/main)
          SOURCE_HASH=$(git rev-parse HEAD)
          echo "Public main now: $PUBLIC_HASH"
          echo "Source head  : $SOURCE_HASH"
          if [ "$PUBLIC_HASH" != "$SOURCE_HASH" ]; then
            echo "::error::Sync failed — public main does not match source head."
            exit 1
          fi
          echo "Sync verified: public main = source head = $PUBLIC_HASH"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Mirror sync FAILED — Demo3AppDataSci may be out of date."
          echo "::error::Possible causes:"
          echo "::error::  1. Actions minutes exhausted on private repo (free quota = 2000 min/month)."
          echo "::error::     -> Fix: use the sync-from-private.yml workflow on Demo3AppDataSci instead."
          echo "::error::  2. SYNC_TO_PUBLIC_PAT expired or revoked."
          echo "::error::  3. Branch protection on Demo3AppDataSci prevents force-push."
